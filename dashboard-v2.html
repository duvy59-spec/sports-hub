<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Family Sports Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: #252535;
  --text: #f4f2ee;
  --muted: #6b6b80;
  --nathaniel: #00d4ff;
  --joelle: #ff6b35;
  --amelie: #7cfc5e;
  --game: #ffd700;
  --practice: #8888aa;
  --cancelled: #ff4455;
  --changed: #ffaa00;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 200;
}
.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 1.5rem;
  letter-spacing: 0.04em; text-transform: uppercase;
  line-height: 1;
}
.logo-family { color: var(--muted); }
.logo-sports { color: var(--text); }
.logo-hub {
  color: var(--game);
  -webkit-text-stroke: 1px var(--game);
}
.header-right { display: flex; align-items: center; gap: 10px; }
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--amelie);
  box-shadow: 0 0 8px var(--amelie);
  animation: livepulse 2s ease-in-out infinite;
}
@keyframes livepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
.last-sync { font-size: 0.7rem; color: var(--muted); }

/* ── KID LEGEND ── */
.kid-legend {
  display: flex; gap: 6px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.kid-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid; font-size: 0.78rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  white-space: nowrap; cursor: pointer; transition: all 0.15s;
}
.kid-pill.nathaniel { border-color: var(--nathaniel); color: var(--nathaniel); }
.kid-pill.joelle { border-color: var(--joelle); color: var(--joelle); }
.kid-pill.amelie { border-color: var(--amelie); color: var(--amelie); }
.kid-pill.active.nathaniel { background: var(--nathaniel); color: #000; }
.kid-pill.active.joelle { background: var(--joelle); color: #000; }
.kid-pill.active.amelie { background: var(--amelie); color: #000; }
.kid-dot-sm { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── MAIN LAYOUT ── */
.main { padding: 16px; max-width: 700px; margin: 0 auto; }

/* ── SECTION HEADERS ── */
.section-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 0.72rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after { content:''; flex:1; height:1px; background: var(--border); }

/* ── CALENDAR SECTION ── */
.calendar-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 24px;
}

.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.cal-nav { display: flex; gap: 6px; }
.cal-btn {
  background: var(--border); border: none; color: var(--text);
  width: 30px; height: 30px; border-radius: 6px;
  font-size: 1rem; cursor: pointer; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.cal-btn:hover { background: var(--surface2); }
.cal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 1.1rem; letter-spacing: 0.05em;
  text-transform: uppercase;
}
.view-toggle {
  display: flex; gap: 3px;
  background: var(--bg); border-radius: 8px; padding: 3px;
}
.view-btn {
  padding: 4px 10px; border-radius: 5px; border: none;
  background: transparent; color: var(--muted);
  font-size: 0.72rem; font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s;
}
.view-btn.active { background: var(--surface2); color: var(--text); }

/* MONTH VIEW */
.cal-grid { padding: 12px; }
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7,1fr);
  margin-bottom: 6px;
}
.cal-weekday {
  text-align: center; font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.7rem; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase; padding: 4px 0;
}
.cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-day {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; transition: all 0.15s;
  background: transparent; border: 1.5px solid transparent;
  padding: 2px;
}
.cal-day:hover { background: var(--surface2); }
.cal-day.today { border-color: var(--game) !important; }
.cal-day.selected { background: var(--surface2); border-color: var(--border); }
.cal-day.other-month .day-num { color: var(--border); }
.day-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.95rem; color: var(--text); line-height: 1;
}
.cal-day.today .day-num { color: var(--game); }
.day-dots { display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap; justify-content: center; }
.day-dot { width: 5px; height: 5px; border-radius: 50%; }

/* WEEK VIEW */
.week-grid { padding: 12px; display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.week-col {
  border-radius: 10px; overflow: hidden; cursor: pointer;
  transition: all 0.15s; border: 1.5px solid var(--border);
}
.week-col:hover { border-color: var(--muted); }
.week-col.today { border-color: var(--game); }
.week-col.selected { border-color: var(--text); background: var(--surface2); }
.week-day-header {
  text-align: center; padding: 8px 4px 6px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.week-day-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.65rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
.week-day-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 1.2rem; line-height: 1;
  color: var(--text);
}
.week-col.today .week-day-num { color: var(--game); }
.week-events { padding: 5px 4px; min-height: 40px; }
.week-event-dot {
  width: 100%; height: 4px; border-radius: 2px; margin-bottom: 3px;
}

/* DAY VIEW */
.day-view { padding: 12px; }
.day-nav-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.day-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase;
}

/* SELECTED DAY EVENTS */
.selected-day-panel {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
}
.selected-day-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 0.85rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.no-events-day { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }

/* ── EVENT CARDS ── */
.event-card {
  display: flex; gap: 12px; align-items: stretch;
  background: var(--surface2); border-radius: 10px;
  margin-bottom: 8px; overflow: hidden;
  border: 1px solid var(--border);
  transition: transform 0.1s;
  cursor: default;
}
.event-card:active { transform: scale(0.99); }
.event-stripe { width: 4px; flex-shrink: 0; }
.event-body { flex: 1; padding: 11px 12px 11px 0; }
.event-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
.event-kid {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
}
.event-type-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px;
}
.badge-game { background: rgba(255,215,0,0.15); color: var(--game); }
.badge-practice { background: rgba(136,136,170,0.15); color: var(--practice); }
.badge-cancelled { background: rgba(255,68,85,0.15); color: var(--cancelled); }
.badge-changed { background: rgba(255,170,0,0.15); color: var(--changed); }
.alert-flag {
  margin-left: auto; font-size: 0.7rem; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.event-sport { font-size: 0.95rem; font-weight: 600; color: var(--text); }
.event-meta {
  display: flex; gap: 14px; flex-wrap: wrap; margin-top: 5px;
}
.meta-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 0.78rem; color: var(--muted);
}
.meta-icon { font-size: 0.75rem; }
.event-change-note {
  margin-top: 6px; font-size: 0.75rem; color: var(--changed);
  display: flex; align-items: center; gap: 4px;
}
.event-right {
  padding: 11px 14px 11px 0;
  display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
  flex-shrink: 0;
}
.event-time {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 1.1rem; color: var(--text); white-space: nowrap;
}
.event-date-sm {
  font-size: 0.7rem; color: var(--muted); white-space: nowrap; margin-top: 2px;
}

/* ── KID SCHEDULES SECTION ── */
.kids-section { margin-bottom: 24px; }
.kid-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; margin-bottom: 14px;
}
.kid-card-header {
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.kid-card-left { display: flex; align-items: center; gap: 10px; }
.kid-color-bar { width: 4px; height: 28px; border-radius: 2px; }
.kid-card-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 1.3rem; letter-spacing: 0.04em; text-transform: uppercase;
}
.kid-sport-tag {
  font-size: 0.75rem; color: var(--muted); font-weight: 500;
}
.kid-event-count {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 0.8rem; letter-spacing: 0.08em;
  padding: 4px 10px; border-radius: 20px; border: 1.5px solid;
}
.kid-card-body { padding: 12px; }
.kid-week-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.68rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.no-events-kid { color: var(--muted); font-size: 0.85rem; padding: 4px 0 8px; }

/* ── ALERTS BANNER ── */
.alerts-banner {
  margin-bottom: 16px;
}
.alert-item {
  background: #1a0f0f;
  border: 1px solid #3a1515;
  border-left: 3px solid var(--cancelled);
  border-radius: 10px; padding: 10px 14px;
  margin-bottom: 6px; display: flex; gap: 10px; align-items: flex-start;
}
.alert-item.changed { background: #1a1500; border-color: #3a3000; border-left-color: var(--changed); }
.alert-emoji { font-size: 1rem; margin-top: 1px; flex-shrink: 0; }
.alert-text { flex: 1; font-size: 0.83rem; line-height: 1.5; }
.alert-ago { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

/* ── UTILS ── */
.chevron { transition: transform 0.2s; display: inline-block; }
.chevron.open { transform: rotate(180deg); }
.collapsed { display: none; }

@media (max-width: 380px) {
  .cal-day { border-radius: 5px; }
  .day-num { font-size: 0.82rem; }
  .week-day-num { font-size: 1rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-family">Family </span><span class="logo-sports">Sports </span><span class="logo-hub">Hub</span>
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <div class="last-sync" id="lastSync">Syncing...</div>
  </div>
</header>

<div class="kid-legend">
  <div class="kid-pill nathaniel active" onclick="toggleKidFilter('Nathaniel',this)">
    <div class="kid-dot-sm"></div> Nathaniel
  </div>
  <div class="kid-pill joelle active" onclick="toggleKidFilter('Joelle',this)">
    <div class="kid-dot-sm"></div> Joelle
  </div>
  <div class="kid-pill amelie active" onclick="toggleKidFilter('Amelie',this)">
    <div class="kid-dot-sm"></div> Amelie
  </div>
</div>

<div class="main">

  <!-- ALERTS -->
  <div id="alertsBanner" class="alerts-banner"></div>

  <!-- CALENDAR -->
  <div class="section-label">Calendar</div>
  <div class="calendar-card">
    <div class="cal-header">
      <div class="cal-nav">
        <button class="cal-btn" onclick="navCal(-1)">‹</button>
        <button class="cal-btn" onclick="navCal(1)">›</button>
      </div>
      <div class="cal-title" id="calTitle"></div>
      <div class="view-toggle">
        <button class="view-btn active" id="vbtn-month" onclick="setCalView('month')">Mo</button>
        <button class="view-btn" id="vbtn-week" onclick="setCalView('week')">Wk</button>
        <button class="view-btn" id="vbtn-day" onclick="setCalView('day')">Day</button>
      </div>
    </div>
    <div id="calBody"></div>
    <div id="selectedDayPanel"></div>
  </div>

  <!-- KID SCHEDULES -->
  <div class="section-label">This Week by Kid</div>
  <div class="kids-section" id="kidsSection"></div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrD6Oou7XVlH8RAdV95gr5tHQ_7QDbTMP_ylrB-SEM-GYFyfgyOL-dPHcMb12dLJ6v4Q/exec';
const REFRESH_MS = 5 * 60 * 1000;

const KIDS_CONFIG = {
  'Nathaniel': { color: '#00d4ff', emoji: 'S', sports: 'Soccer / Basketball', cls: 'nathaniel' },
  'Joelle':    { color: '#ff6b35', emoji: 'B', sports: 'Basketball', cls: 'joelle' },
  'Amelie':    { color: '#7cfc5e', emoji: 'B', sports: 'Basketball / Dance', cls: 'amelie' },
};

let allEvents = [];
let calView = 'month';
let calDate = new Date();
let selectedDate = toDateStr(new Date());
let activeKids = new Set(['Nathaniel','Joelle','Amelie']);

// ── DATA ──────────────────────────────────────────────
async function fetchData() {
  try {
    if (!SCRIPT_URL || SCRIPT_URL.includes('YOUR_')) { loadDemo(); return; }
    const res = await fetch(SCRIPT_URL + '?action=getEvents&t=' + Date.now());
    const data = await res.json();
    allEvents = data.events || [];
    document.getElementById('lastSync').textContent = 'Synced ' + fmtTime(new Date());
    render();
  } catch(e) { loadDemo(); }
}

function loadDemo() {
  const t = new Date(); t.setHours(0,0,0,0);
  const add = (n) => { const d = new Date(t); d.setDate(t.getDate()+n); return toDateStr(d); };
  allEvents = [
    { id:1, child:'Nathaniel', sport:'Soccer',     type:'Game',     date:add(0),  time:'5:30 PM', location:'Riverside Field', status:'active',    changedAt:null, changeNote:null },
    { id:2, child:'Joelle',    sport:'Basketball', type:'Practice', date:add(0),  time:'6:30 PM', location:'School Gym',      status:'changed',   changedAt:new Date(Date.now()-5400000).toISOString(), changeNote:'Time moved from 5:30pm' },
    { id:3, child:'Nathaniel', sport:'Basketball', type:'Practice', date:add(1),  time:'4:00 PM', location:'CMEK Gym',        status:'active',    changedAt:null, changeNote:null },
    { id:4, child:'Amelie',    sport:'Basketball', type:'Game',     date:add(2),  time:'9:00 AM', location:'Rec Center',      status:'active',    changedAt:null, changeNote:null },
    { id:5, child:'Joelle',    sport:'Basketball', type:'Game',     date:add(2),  time:'11:00 AM',location:'Main Court',      status:'active',    changedAt:null, changeNote:null },
    { id:6, child:'Nathaniel', sport:'Soccer',     type:'Practice', date:add(3),  time:'5:30 PM', location:'Riverside Field', status:'cancelled', changedAt:new Date(Date.now()-1800000).toISOString(), changeNote:'Field flooded' },
    { id:7, child:'Amelie',    sport:'Basketball', type:'Practice', date:add(5),  time:'4:00 PM', location:'Broncos Court',   status:'active',    changedAt:null, changeNote:null },
    { id:8, child:'Joelle',    sport:'Basketball', type:'Practice', date:add(6),  time:'5:00 PM', location:'School Gym',      status:'active',    changedAt:null, changeNote:null },
    { id:9, child:'Nathaniel', sport:'Soccer',     type:'Game',     date:add(8),  time:'10:00 AM',location:'Memorial Park',   status:'active',    changedAt:null, changeNote:null },
    { id:10,child:'Amelie',    sport:'Basketball', type:'Game',     date:add(10), time:'1:00 PM', location:'Rec Center',      status:'active',    changedAt:null, changeNote:null },
  ];
  document.getElementById('lastSync').textContent = 'Demo mode';
  render();
}

// ── RENDER ────────────────────────────────────────────
function render() {
  renderAlerts();
  renderCalendar();
  renderSelectedDay();
  renderKids();
}

function visibleEvents() {
  return allEvents.filter(e => activeKids.has(e.child));
}

// ── ALERTS ────────────────────────────────────────────
function renderAlerts() {
  const cutoff = Date.now() - 6 * 3600000;
  const alerts = allEvents
    .filter(e => e.changedAt && new Date(e.changedAt).getTime() > cutoff)
    .sort((a,b) => new Date(b.changedAt) - new Date(a.changedAt));

  const el = document.getElementById('alertsBanner');
  if (!alerts.length) { el.innerHTML = ''; return; }
  el.innerHTML = alerts.map(e => {
    const isCan = e.status === 'cancelled';
    return `<div class="alert-item ${isCan?'':'changed'}">
      <div class="alert-emoji">${isCan?'❌':'⚠️'}</div>
      <div class="alert-text">
        <strong style="color:${isCan?'var(--cancelled)':'var(--changed)'}">${isCan?'CANCELLED':'UPDATED'}</strong>
        — <span style="color:${kidColor(e.child)}">${e.child}</span>'s
        ${e.sport} ${e.type} on ${fmtDateShort(e.date)}
        ${e.changeNote ? `<br><span style="color:#aaa">${e.changeNote}</span>` : ''}
        <div class="alert-ago">${timeAgo(new Date(e.changedAt))}</div>
      </div>
    </div>`;
  }).join('');
}

// ── CALENDAR ──────────────────────────────────────────
function renderCalendar() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  if (calView === 'month') {
    document.getElementById('calTitle').textContent = months[calDate.getMonth()] + ' ' + calDate.getFullYear();
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const first = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrev = new Date(y, m, 0).getDate();
    const today = toDateStr(new Date());

    let html = `<div class="cal-grid">
      <div class="cal-weekdays">${days.map(d=>`<div class="cal-weekday">${d}</div>`).join('')}</div>
      <div class="cal-days">`;

    for (let i=0; i<first; i++) {
      const d = daysInPrev - first + 1 + i;
      html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
    }
    for (let d=1; d<=daysInMonth; d++) {
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayEvs = visibleEvents().filter(e => e.date === ds && e.status !== 'cancelled');
      const isToday = ds === today;
      const isSel = ds === selectedDate;
      html += `<div class="cal-day${isToday?' today':''}${isSel?' selected':''}" onclick="selectDay('${ds}')">
        <div class="day-num">${d}</div>
        <div class="day-dots">${dayEvs.slice(0,3).map(e=>`<div class="day-dot" style="background:${kidColor(e.child)}"></div>`).join('')}</div>
      </div>`;
    }
    const remaining = 42 - first - daysInMonth;
    for (let d=1; d<=remaining; d++) {
      html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
    }
    html += `</div></div>`;
    document.getElementById('calBody').innerHTML = html;

  } else if (calView === 'week') {
    const weekStart = new Date(calDate);
    weekStart.setDate(calDate.getDate() - calDate.getDay());
    const today = toDateStr(new Date());
    document.getElementById('calTitle').textContent = fmtDateShort(toDateStr(weekStart)) + ' – ' + fmtDateShort(toDateStr(new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()+6)));

    let html = `<div class="week-grid">`;
    for (let i=0; i<7; i++) {
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
      const ds = toDateStr(d);
      const dayEvs = visibleEvents().filter(e => e.date === ds && e.status !== 'cancelled');
      const isToday = ds === today;
      const isSel = ds === selectedDate;
      html += `<div class="week-col${isToday?' today':''}${isSel?' selected':''}" onclick="selectDay('${ds}')">
        <div class="week-day-header">
          <div class="week-day-name">${days[i]}</div>
          <div class="week-day-num">${d.getDate()}</div>
        </div>
        <div class="week-events">${dayEvs.map(e=>`<div class="week-event-dot" style="background:${kidColor(e.child)}"></div>`).join('')}</div>
      </div>`;
    }
    html += `</div>`;
    document.getElementById('calBody').innerHTML = html;

  } else { // day
    const d = new Date(selectedDate + 'T00:00:00');
    document.getElementById('calTitle').textContent = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    document.getElementById('calBody').innerHTML = `<div class="day-view">
      <div class="day-nav-row">
        <button class="cal-btn" onclick="navDay(-1)">‹ Prev</button>
        <button class="cal-btn" onclick="navDay(1)">Next ›</button>
      </div>
    </div>`;
  }
}

function renderSelectedDay() {
  const panel = document.getElementById('selectedDayPanel');
  const d = new Date(selectedDate + 'T00:00:00');
  const label = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const dayEvs = visibleEvents().filter(e => e.date === selectedDate)
    .sort((a,b) => parseTime(a.time) - parseTime(b.time));

  let html = `<div class="selected-day-panel">
    <div class="selected-day-title">📅 ${label}</div>`;

  if (!dayEvs.length) {
    html += `<div class="no-events-day">No events</div>`;
  } else {
    html += dayEvs.map(e => renderEventCard(e, false)).join('');
  }
  html += `</div>`;
  panel.innerHTML = html;
}

function renderKids() {
  const section = document.getElementById('kidsSection');
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  weekStart.setHours(0,0,0,0);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);

  section.innerHTML = Object.entries(KIDS_CONFIG).map(([name, cfg]) => {
    if (!activeKids.has(name)) return '';
    const weekEvs = allEvents
      .filter(e => e.child === name && new Date(e.date+'T00:00:00') >= weekStart && new Date(e.date+'T00:00:00') <= weekEnd)
      .sort((a,b) => new Date(a.date) - new Date(b.date));

    const gameCount = weekEvs.filter(e=>e.type==='Game'&&e.status!=='cancelled').length;
    const pracCount = weekEvs.filter(e=>e.type==='Practice'&&e.status!=='cancelled').length;
    const countLabel = [gameCount?`${gameCount}G`:'', pracCount?`${pracCount}P`:''].filter(Boolean).join(' / ') || '0';

    return `<div class="kid-card">
      <div class="kid-card-header" onclick="toggleKidCard('${name}')">
        <div class="kid-card-left">
          <div class="kid-color-bar" style="background:${cfg.color}"></div>
          <div>
            <div class="kid-card-name" style="color:${cfg.color}">${name}</div>
            <div class="kid-sport-tag">${cfg.sports}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="kid-event-count" style="border-color:${cfg.color};color:${cfg.color}">${countLabel} this week</div>
          <span class="chevron open" id="chev-${name}">▾</span>
        </div>
      </div>
      <div class="kid-card-body" id="kidbody-${name}">
        <div class="kid-week-label">This week</div>
        ${weekEvs.length ? weekEvs.map(e=>renderEventCard(e,true)).join('') : `<div class="no-events-kid">No events this week</div>`}
      </div>
    </div>`;
  }).join('');
}

// ── EVENT CARD ────────────────────────────────────────
function renderEventCard(e, showDate) {
  const isCan = e.status === 'cancelled';
  const isCh = e.status === 'changed';
  const color = kidColor(e.child);
  const badge = isCan ? 'badge-cancelled' : (e.type==='Game' ? 'badge-game' : 'badge-practice');
  const badgeLabel = isCan ? 'Cancelled' : e.type;
  const d = new Date(e.date+'T00:00:00');
  const dateStr = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  return `<div class="event-card" style="opacity:${isCan?0.55:1}">
    <div class="event-stripe" style="background:${color}"></div>
    <div class="event-body">
      <div class="event-top">
        <span class="event-kid" style="color:${color}">${e.child}</span>
        <span class="event-type-badge ${badge}">${badgeLabel}</span>
        ${isCh ? `<span class="alert-flag" style="color:var(--changed)">⚠️ Updated</span>` : ''}
      </div>
      <div class="event-sport">${e.sport}</div>
      <div class="event-meta">
        ${e.time ? `<div class="meta-item"><span class="meta-icon">🕐</span>${e.time}</div>` : ''}
        ${e.location&&e.location!=='TBD' ? `<div class="meta-item"><span class="meta-icon">📍</span>${e.location}</div>` : ''}
      </div>
      ${isCh&&e.changeNote ? `<div class="event-change-note">⚠️ ${e.changeNote}</div>` : ''}
    </div>
    <div class="event-right">
      <div class="event-time">${e.time||'TBD'}</div>
      ${showDate ? `<div class="event-date-sm">${dateStr}</div>` : ''}
    </div>
  </div>`;
}

// ── INTERACTIONS ──────────────────────────────────────
function setCalView(v) {
  calView = v;
  ['month','week','day'].forEach(x => {
    document.getElementById('vbtn-'+x).classList.toggle('active', x===v);
  });
  if (v === 'week') {
    calDate = new Date(selectedDate+'T00:00:00');
  }
  renderCalendar();
  renderSelectedDay();
}

function selectDay(ds) {
  selectedDate = ds;
  calDate = new Date(ds+'T00:00:00');
  renderCalendar();
  renderSelectedDay();
  document.getElementById('selectedDayPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function navCal(dir) {
  if (calView === 'month') {
    calDate.setMonth(calDate.getMonth() + dir);
  } else if (calView === 'week') {
    calDate.setDate(calDate.getDate() + dir*7);
    selectedDate = toDateStr(calDate);
  } else {
    calDate.setDate(calDate.getDate() + dir);
    selectedDate = toDateStr(calDate);
  }
  renderCalendar();
  renderSelectedDay();
}

function navDay(dir) {
  const d = new Date(selectedDate+'T00:00:00');
  d.setDate(d.getDate()+dir);
  selectedDate = toDateStr(d);
  calDate = new Date(d);
  renderCalendar();
  renderSelectedDay();
}

function toggleKidCard(name) {
  const body = document.getElementById('kidbody-'+name);
  const chev = document.getElementById('chev-'+name);
  body.classList.toggle('collapsed');
  chev.classList.toggle('open');
}

function toggleKidFilter(name, el) {
  if (activeKids.has(name)) {
    if (activeKids.size > 1) { activeKids.delete(name); el.classList.remove('active'); }
  } else {
    activeKids.add(name); el.classList.add('active');
  }
  render();
}

// ── HELPERS ───────────────────────────────────────────
function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function kidColor(name) { return KIDS_CONFIG[name]?.color || '#888'; }
function fmtTime(d) { return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function fmtDateShort(ds) {
  const d = new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function parseTime(t) {
  if (!t||t==='TBD') return 9999;
  const [time,ampm] = t.split(' ');
  let [h,m] = time.split(':').map(Number);
  if (ampm==='PM'&&h!==12) h+=12;
  if (ampm==='AM'&&h===12) h=0;
  return h*60+(m||0);
}
function timeAgo(d) {
  const m = Math.floor((Date.now()-d.getTime())/60000);
  if (m<5) return 'just now';
  if (m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if (h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

// ── INIT ──────────────────────────────────────────────
selectedDate = toDateStr(new Date());
calDate = new Date();
fetchData();
setInterval(fetchData, REFRESH_MS);
</script>
